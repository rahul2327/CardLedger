
name: Build CardLedger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web bundle for Android
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Ensure valid Android resource directory names
        run: |
          for bad_dir in android/app/src/main/res/drawable-night-land-* android/app/src/main/res/drawable-night-port-*; do
            [ -d "$bad_dir" ] || continue
            base=$(basename "$bad_dir")
            fixed=$(echo "$base" | sed -E 's/^drawable-night-(land|port)-/drawable-\1-night-/')
            target="android/app/src/main/res/$fixed"
            mkdir -p "$target"
            cp -rn "$bad_dir"/. "$target"/ 2>/dev/null || true
            rm -rf "$bad_dir"
          done

      - name: Build Android APK (Release if keystore configured, else Debug)
        id: build_apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARDLEDGER_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARDLEDGER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARDLEDGER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$CARDLEDGER_STORE_PASSWORD" ] && [ -n "$CARDLEDGER_KEY_ALIAS" ] && [ -n "$CARDLEDGER_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks
            export CARDLEDGER_STORE_FILE="$(pwd)/app/release.jks"
            ./gradlew assembleRelease
            rm -f app/release.jks
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=CardLedger-Android-Release-APK" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=CardLedger-Android-Debug-APK" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK exists
        run: |
          test -f "${{ steps.build_apk.outputs.apk_path }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_apk.outputs.artifact_name }}
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CardLedger Build ${{ github.run_number }}
          files: ${{ steps.build_apk.outputs.apk_path }}
          generate_release_notes: true
