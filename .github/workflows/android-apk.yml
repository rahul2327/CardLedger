name: Build and Release CardLedger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clean legacy invalid resource & Capacitor artifacts
        run: |
          rm -rf android/app/src/main/res/drawable-night-land-* \
                 android/app/src/main/res/drawable-night-port-* \
                 android/app/src/main/java/com/rahul2327/cardledger/MainActivity.java \
                 android/app/src/main/java/com/rahul2327/cardledger/BiometricAuthPlugin.java \
                 android/app/src/main/res/layout/activity_main.xml \
                 android/app/src/main/res/xml/config.xml \
                 android/app/src/main/assets \
                 android/app/capacitor.build.gradle \
                 android/capacitor.settings.gradle \
                 android/capacitor-cordova-android-plugins \
                 android/variables.gradle \
                 android/app/src/test/java/com/getcapacitor \
                 android/app/src/androidTest/java/com/getcapacitor

      - name: Build Native Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardLedger-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cardledger-${{ github.run_number }}-${{ github.run_attempt }}
          name: CardLedger Native Android Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
