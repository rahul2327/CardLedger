name: Build and Release CardLedger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clean legacy invalid resource & Capacitor artifacts
        run: |
          rm -rf android/app/src/main/res/drawable-night-land-* \
                 android/app/src/main/res/drawable-night-port-* \
                 android/app/src/main/java/com/rahul2327/cardledger/MainActivity.java \
                 android/app/src/main/java/com/rahul2327/cardledger/BiometricAuthPlugin.java \
                 android/app/src/main/res/layout/activity_main.xml \
                 android/app/src/main/res/xml/config.xml \
                 android/app/src/main/assets \
                 android/app/capacitor.build.gradle \
                 android/capacitor.settings.gradle \
                 android/capacitor-cordova-android-plugins \
                 android/variables.gradle \
                 android/app/src/test/java/com/getcapacitor \
                 android/app/src/androidTest/java/com/getcapacitor

      - name: Build Native Android APK (Release if secrets configured, else Debug)
        id: build_apk
        working-directory: android
        env:
          CARDLEDGER_KEYSTORE_BASE64: ${{ secrets.CARDLEDGER_KEYSTORE_BASE64 }}
          CARDLEDGER_STORE_PASSWORD: ${{ secrets.CARDLEDGER_STORE_PASSWORD }}
          CARDLEDGER_KEY_ALIAS: ${{ secrets.CARDLEDGER_KEY_ALIAS }}
          CARDLEDGER_KEY_PASSWORD: ${{ secrets.CARDLEDGER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$CARDLEDGER_KEYSTORE_BASE64" ] && [ -n "$CARDLEDGER_STORE_PASSWORD" ] && [ -n "$CARDLEDGER_KEY_ALIAS" ] && [ -n "$CARDLEDGER_KEY_PASSWORD" ]; then
            echo "Release signing secrets detected — building signed Release APK"
            printf '%s' "$CARDLEDGER_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/cardledger-release.jks
            export CARDLEDGER_STORE_FILE="/tmp/cardledger-release.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/CardLedger-release.apk
            echo "apk_path=android/app/build/outputs/apk/CardLedger-release.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Release" >> "$GITHUB_OUTPUT"
          else
            echo "No release signing secrets found — building Debug APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/CardLedger-debug.apk
            echo "apk_path=android/app/build/outputs/apk/CardLedger-debug.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/cardledger-release.jks

      - name: Verify APK
        run: |
          test -f "${{ steps.build_apk.outputs.apk_path }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CardLedger-${{ steps.build_apk.outputs.build_type }}-APK
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cardledger-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="CardLedger Native Android (${{ steps.build_apk.outputs.build_type }}) Build ${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.build_apk.outputs.apk_path }}" \
            --title "$TITLE" \
            --generate-notes
