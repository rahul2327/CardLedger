
name: Build CardLedger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web bundle for Android
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Ensure valid Android resource directory names
        run: |
          for bad_dir in android/app/src/main/res/drawable-night-land-* android/app/src/main/res/drawable-night-port-*; do
            [ -d "$bad_dir" ] || continue
            base=$(basename "$bad_dir")
            fixed=$(echo "$base" | sed -E 's/^drawable-night-(land|port)-/drawable-\1-night-/')
            target="android/app/src/main/res/$fixed"
            mkdir -p "$target"
            cp -rn "$bad_dir"/. "$target"/ 2>/dev/null || true
            rm -rf "$bad_dir"
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CardLedger-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CardLedger Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
