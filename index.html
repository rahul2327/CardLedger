<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CardLedger — Offline Credit Card &amp; Bank Tracker</title>
    <meta
      name="description"
      content="100% offline personal finance tracker for managing credit card spending, billing cycles, upcoming bills, and bank balances locally on your device."
    />
    <meta property="og:title" content="CardLedger — Offline Credit Card &amp; Bank Tracker" />
    <meta
      property="og:description"
      content="100% offline personal finance tracker for managing credit card spending, billing cycles, upcoming bills, and bank balances locally on your device."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F7FAF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CardLedger" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cardledger_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-m3-surface text-m3-on-surface antialiased selection:bg-m3-primary-container selection:text-m3-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
